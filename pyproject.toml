[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI intentionally evaluates dependency marker objects in parameter
# defaults when the equivalent Annotated form would make signatures less clear.
"app/routers/*.py" = ["B008"]
